spring.application.name=StartAi

#deepseek
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.chat.options.model=deepseek-chat

# Agent 学习用：打印模型请求/工具调用日志，观察 Agent 的工作过程
logging.level.org.springframework.ai=DEBUG

# ===== 模型装配：聊天用 DeepSeek，embedding 走 OpenAI 协议（实连 DashScope 兼容模式）=====
spring.ai.model.chat=deepseek
spring.ai.model.embedding=openai

# DashScope 的 OpenAI 兼容模式（只用于 embedding，key 即百炼 API-KEY）
# 注意：Spring AI 2.0 的 base-url 必须以 /v1 结尾，SDK 不会自动补
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
spring.ai.openai.api-key=${DASHSCOPE_API_KEY:}
spring.ai.openai.embedding.options.model=qwen3.7-text-embedding-flash

# ===== MCP Client：连接官方 filesystem server（stdio 方式）=====
# Windows 下 npx 是 .cmd 脚本，必须用 cmd.exe /c 包装，Java 无法直接执行
spring.ai.mcp.client.enabled=true
# 把 MCP 工具注册为 ToolCallbackProvider，供 ChatClient 使用
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.stdio.connections.filesystem.command=cmd.exe
spring.ai.mcp.client.stdio.connections.filesystem.args=/c,npx,-y,@modelcontextprotocol/server-filesystem,D:/codes/myProject

# 第二个 MCP Server：GitHub（Issue/PR/仓库操作），token 建议用环境变量注入
# 已全局安装（npm i -g），直接用全局命令，避免 npx 缓存损坏问题
spring.ai.mcp.client.stdio.connections.github.command=cmd.exe
spring.ai.mcp.client.stdio.connections.github.args=/c,mcp-server-github
spring.ai.mcp.client.stdio.connections.github.env.GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_TOKEN:}
